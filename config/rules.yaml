  # Round 3: top unmatched inbox domains (~45 vendors, ~700 messages).
  - id: reizen-promo
    match: { from_domain: [email.voyageprive.be, e.vliegtickets.nl, laterooms.com, sender.skyscanner.com, mc.ihg.com, reply.checkyeti.com, info-flyingblue.com] }
    actions: { add_labels: ["Reizen"] }
  # klm.com is mixed (work travel, private flights, Flying Blue promos) - only
  # travel-document mail is safe to label by domain.
  # klm.com is the former employer's domain - colleague mail, not travel.
  # Only travel-document subjects mean Reizen; everything else is Werk/KLM.
  - id: werk-klm-domain
    match: { from_domain: [klm.com] }
    exclude:
      - has_label: [CATEGORY_PROMOTIONS]
        subject_not_contains: *transactional_subject
      - subject_contains: [boardingpas, boarding pass, vlucht, flight, booking, reservering]
    actions: { add_labels: ["Werk/KLM"] }
  - id: reizen-klm-travel
    match:
      from_domain: [klm.com]
      subject_contains: [boardingpas, "boarding pass", vlucht, flight, booking, reservering]
    exclude: *promo_screen
    actions: { add_labels: ["Reizen"] }
