  # Gmail already separates promotional mail; trust that signal for the bulk
  # sweep, but never sweep a message whose subject reads as a real transaction.
  - id: promo-category-archive
    match: { has_label: [CATEGORY_PROMOTIONS] }
    exclude:
      - subject_contains: *transactional_subject
        subject_not_contains: *promo_wording
      # Gmail sometimes files a genuine appointment or callback as promotional;
      # never sweep those out of the inbox.
      - subject_contains: [afspraak, terugbelverzoek, "oriënterend gesprek", aanvraag,
          ondertekenen, wwft, identificatie, aanslag, aangifte, incasso, machtiging,
          koopovereenkomst, notaris, taxatie, aanmaning, naheffing, opzegging]
      # Travel operations and account security are never worth a false archive,
      # even when Gmail files them as promotional. Price alerts say "vluchten
      # naar", so they are not caught by the possessive forms below.
      - subject_contains: ["your flight", "upcoming flight", "je vlucht", "uw vlucht",
          "flight to", check-in, boarding, geannuleerd, cancelled, vertraging, omgeboekt,
          rebook, gate change]
      - subject_contains: [wachtwoord, password, verificatiecode, "verification code",
          "verify your", inloggen, "security alert", "beveiligingswaarschuwing", 2fa,
          "ongebruikelijke aanmelding", "new sign-in"]
    actions: { add_labels: ["to-be-removed"], archive: true }

  # Promo/commercial bulk: archived and flagged for manual deletion in Gmail.
  # MailBrain never deletes - the to-be-removed label is the hand-off.
  - id: promo-archive
    match:
      from_domain: [email.voyageprive.be, e.vliegtickets.nl, laterooms.com, sender.skyscanner.com, mc.ihg.com, reply.checkyeti.com, info-flyingblue.com, members.netflix.com, mail.pathe-thuis.nl, mailing.airmiles.nl, cashbackxl.nl, tacomundo.com, email.lecol.cc, nieuwsbrief.ah.nl, notifications.autoscout24.com, marktplaats.nl, email.greenpeace.nl, service.donaldduck.nl, asmodee.net]
    exclude:
      subject_contains: *transactional_subject
      subject_not_contains: *promo_wording
    actions: { add_labels: ["to-be-removed"], archive: true }

  # Content newsletters: archived only where the weekly Notion TLDR covers them
  # (TLDR history starts 11 June 2026; older editions get to-review instead).
  # Editorial senders: their headlines quote words like "pakket" and "retour",
  # so a transactional screen here would strand news in the inbox.
  - id: nieuwsbrief-archive-tldr-covered
    match:
      from_domain: [messagent.fdmediagroep.nl, mail.fortune.com, m.learn.coursera.org, codemotion.it, ifttt.com, avagasso.com, gortcoaching.nl, bridgeman.nl, azull.info, androidweekly.net, leaddev.com, email.trainingpeaks.com]
    exclude: { older_than_days: 88 }
    actions: { archive: true }
  # These two also sell: screen their order and invoice mail out of the sweep.
  - id: nieuwsbrief-archive-webshop-senders
    match:
      from_domain: [boekenbalie.nl, jetbrains.com]
    exclude:
      - older_than_days: 88
      - subject_contains: *transactional_subject
    actions: { archive: true }
  - id: nieuwsbrief-to-review-pre-tldr
    match:
      from_domain: [messagent.fdmediagroep.nl, mail.fortune.com, m.learn.coursera.org, jetbrains.com, codemotion.it, ifttt.com, boekenbalie.nl, avagasso.com, gortcoaching.nl, bridgeman.nl, azull.info, androidweekly.net, leaddev.com, email.trainingpeaks.com]
      older_than_days: 88
    exclude: { subject_contains: *transactional_subject }
    actions: { add_labels: ["to-review"] }
