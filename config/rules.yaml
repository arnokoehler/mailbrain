# Generated from existing Gmail labels: vendor domains that map >=70% to one label.
# Personal mail (gmail/hotmail/etc.) is intentionally excluded - not domain-separable.
_vocab:
  # Second screening axis: is this mail transactional or promotional?
  # Gmail's own CATEGORY_PROMOTIONS is the high-precision signal; the subject
  # tokens only cover wording that never appears in a real order confirmation.
  transactional_subject: &transactional_subject
    [bestelling, order, factuur, invoice, receipt, betaling, betaald, bezorgd, bezorging,
      verzonden, shipped, delivered, retour, return, pakket, verzending, geleverd, levering,
      bevestiging, confirmation, afhaal, boardingpas, reservering, renewal, subscription,
      abonnement, verlenging, loonstrook, salaris, salarisspecificatie, transactiebewijs,
      ontvangstbewijs, "je bon", betaalbewijs]
  # Commercial-intent wording. Ads happily quote transactional words ("20%
  # korting op je bestelling", "GRATIS bezorging"), so a transactional screen
  # needs this as its own carve-out or it drags adverts back into the inbox.
  promo_wording: &promo_wording
    [korting, kortingscode, deal, deals, aanbieding, gratis, bespaar, voordeel, actie,
      "% off", "scoor", "mega", cadeautip, "alleen dit weekend", "alleen vandaag",
      "laatste kans", "laatste dag", sale, uitverkoop, opruiming, outlet, giveaway,
      bonus, "shop nu", "shop de", topdeals, prijsfavorieten, "black friday",
      "cyber monday", "back to school", voordeelweken, "flash sale"]
  promo_screen: &promo_screen
    # Gmail's promotional bucket vetoes a vendor label, but only when the
    # subject does not read as a real transaction - Gmail misfiles those too.
    - has_label: [CATEGORY_PROMOTIONS]
      subject_not_contains: *transactional_subject
    - subject_contains: ["laatste kans", "laatste dag", sale, uitverkoop, opruiming,
        "black friday", "cyber monday", "back to school", topdeals, prijsfavorieten,
        "% off", outlet, "flash sale", giveaway, voordeelweken, "alleen vandaag"]
      subject_not_contains: *transactional_subject

