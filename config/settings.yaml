gmail:
  scan_query: "in:inbox"
  page_size: 500
  batch_size: 1000

ai:
  enabled: false
  provider: mistral
  model: mistral-small-latest
  api_key_env: MISTRAL_API_KEY
  max_digest_messages: 100
  confidence_floor: 0.85

notion:
  enabled: false
  parent_page_id: "39a840ba5dab8129a775ccb343e24bee"
  token_env: NOTION_TOKEN

safety:
  max_mutations: null
  max_archives: null
  max_archive_fraction: null
  max_scan_age_minutes: null
  protected_label_prefixes:
    - Administratie/Loonstrook
    - Beleggen
    - hypotheek
  protected_subject_contains:
    - loonstrook
    - salarisspecificatie
    - transactie
    - afschrijving
    - factuur
    - security alert
    - beveiligingswaarschuwing
    - hypotheek
    - boarding pass
    - boardingpas
    - vluchtwijziging
  protected_subject_regex: []
